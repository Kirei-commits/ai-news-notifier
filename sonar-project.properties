# SonarQube Cloud (sonarcloud.io) の設定
# organization / projectKey は SonarQube Cloud 上で作成した値に合わせること
sonar.organization=kirei-commits
sonar.projectKey=Kirei-commits_ai-news-notifier
sonar.projectName=ai-news-notifier

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,dist/**,coverage/**,node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
